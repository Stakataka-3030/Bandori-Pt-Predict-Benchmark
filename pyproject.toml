[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bandori-pt-predict-benchmark"
version = "0.1.4"
description = "Causal coarse-window benchmark for Bandori event cutoff forecasts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bandoribench = "bandoribench:main"

[tool.setuptools]
py-modules = ["bandoribench"]
